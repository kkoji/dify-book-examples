        - id: '2'
          label: 勤怠
          name: 休暇申請、残業、打刻、勤務時間など、勤怠に関する問い合わせ
        - id: '3'
          label: IT
          name: PC、アカウント、パスワード、社内システムの不具合など、IT に関する問い合わせ
        - id: '4'
          label: その他
          name: 上記のいずれにも当てはまらない問い合わせ
