app:
  description: 問い合わせを分類し、会話変数と Memory で多ターンの状態を持つ Chatflow
  icon: 💬
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: 'chatflow: support-chatflow'
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.2@ef203a332d1b2b8952dbaa012be70be3e0a2d576b001489fb3b070efc970ffbe
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables:
  - description: 直近の問い合わせ種別
    id: 3df3830f-e82e-47ee-a801-509820f9f1d6
    name: category
    selector:
    - conversation
    - category
    value: ''
    value_type: string
  - description: ユーザーが名乗った部署
    id: d97f5278-9d70-4bc4-818d-7cebdfb296cf
