    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: question-classifier
      id: start-source-classifier-target
      source: start
      sourceHandle: source
      target: classifier
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: parameter-extractor
      id: classifier-1-extract-target
      source: classifier
      sourceHandle: '1'
      target: extract
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: parameter-extractor
      id: classifier-2-extract-target
      source: classifier
      sourceHandle: '2'
      target: extract
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
