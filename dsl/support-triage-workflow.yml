          \    needs_human = result.get(\"needs_human\", True)\n    if isinstance(needs_human,\
          \ str):\n        needs_human = needs_human.strip().lower() in (\"true\"\
          , \"yes\", \"1\")\n    return {\n        \"category\": str(result.get(\"\
          category\") or class_label),\n        \"answer\": str(result.get(\"answer\"\
          , \"\")).strip(),\n        \"needs_human\": bool(needs_human),\n    }\n"
