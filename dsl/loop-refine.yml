          var_type: string
        - id: lv_feedback
          label: feedback
          value: ''
          value_type: constant
          var_type: string
        - id: lv_score
          label: score
          value: 0
          value_type: constant
          var_type: number
        - id: lv_attempt
          label: attempt
          value: 0
          value_type: constant
          var_type: number
        selected: false
        start_node_id: loop_start
        title: 'Loop: refine'
        type: loop
        width: 1340
      height: 260
      id: loop
      position:
