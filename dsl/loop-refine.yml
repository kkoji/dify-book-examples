        - value_selector:
          - loop
          - draft
          value_type: string
          variable: answer
        - value_selector:
          - loop
          - score
          value_type: number
          variable: score
        - value_selector:
          - loop
          - attempt
          value_type: number
          variable: attempts
        selected: false
        title: Output
        type: end
      height: 90
      id: end
      position:
        x: 1740
        y: 300
      positionAbsolute:
        x: 1740
        y: 300
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.6
  rag_pipeline_variables: []
