app:
  description: 'agent 章のサンプル。Legacy Agent(mode: agent-chat)に組み込みツール Current Time を
    1 つ持たせる'
  icon: 🤖
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: agent-chat
  name: 'agent: legacy-agent'
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.2@ef203a332d1b2b8952dbaa012be70be3e0a2d576b001489fb3b070efc970ffbe
    version: null
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 5
    prompt: null
    strategy: function_call
    tools:
    - enabled: true
      provider_id: time
      provider_name: time
      provider_type: builtin
      tool_label: Current Time
      tool_name: current_time
      tool_parameters:
        format: '%Y-%m-%d %H:%M:%S (%A)'
        timezone: Asia/Tokyo
      type: builtin
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
  model:
    completion_params:
      stop: []
      temperature: 0.1
    mode: chat
    name: qwen2.5:7b
    provider: langgenius/ollama/ollama
  more_like_this:
    enabled: false
  opening_statement: ''
  pre_prompt: 'あなたは社内ヘルプデスクの担当者です。問い合わせに日本語で 3 文以内で答えてください。

    日付や時刻、曜日に関わる判断(締め切り、営業時間、受付可否)が必要なときは、推測せずに必ず Current Time ツールで現在時刻を確認してから答えてください。

    規程や手続きの詳細を断定できない場合は、担当部署に確認して折り返すと案内してください。'
  prompt_type: simple
  retriever_resource:
    enabled: false
  sensitive_word_avoidance:
    enabled: false
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.7.0
