app:
  description: 社内規程ナレッジを Knowledge Retrieval で引いて回答する Chatflow
  icon: 📚
  icon_background: '#E4FBCC'
  icon_type: emoji
  mode: advanced-chat
  name: 'knowledge: rag-chatflow'
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.2@ef203a332d1b2b8952dbaa012be70be3e0a2d576b001489fb3b070efc970ffbe
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: knowledge-retrieval
      id: start-source-kr-target
      source: start
      sourceHandle: source
      target: kr
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: kr-source-llm-target
      source: kr
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: llm-source-answer-target
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: User Input
        type: start
        variables:
        - label: department
          max_length: 48
          options:
          - general-affairs
          - human-resources
          - information-systems
          required: true
          type: select
          variable: department
      height: 90
      id: start
      position:
        x: 30
        y: 200
      positionAbsolute:
        x: 30
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids:
        - 1TXXVqaoKKpKjO2ONw3vmjjS9dFtPhUQAo96hZ4lQH0xO701zMtf4Cxy6uMBew5A
        desc: ''
        metadata_filtering_conditions:
          conditions:
          - comparison_operator: is
            id: department-cond
            name: department
            value: '{{#start.department#}}'
          logical_operator: and
        metadata_filtering_mode: manual
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: weighted_score
          reranking_model: null
          score_threshold: null
          top_k: 4
          weights:
            keyword_setting:
              keyword_weight: 0.3
            vector_setting:
              embedding_model_name: nomic-embed-text
              embedding_provider_name: langgenius/ollama/ollama
              vector_weight: 0.7
            weight_type: customized
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        selected: false
        title: Knowledge Retrieval
        type: knowledge-retrieval
      height: 90
      id: kr
      position:
        x: 330
        y: 200
      positionAbsolute:
        x: 330
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - kr
          - result
        desc: ''
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: qwen2.5:7b
          provider: langgenius/ollama/ollama
        prompt_template:
        - role: system
          text: 'あなたは社内ヘルプデスクの担当者です。次の <context> に含まれる社内規程の抜粋だけを根拠に、日本語で 3 文以内で回答してください。抜粋に書かれていないことは「規程に記載がありません。担当部署に確認してください」と答えてください。

            <context>

            {{#context#}}

            </context>'
        - role: user
          text: '{{#sys.query#}}'
        selected: false
        title: LLM
        type: llm
        vision:
          enabled: false
      height: 90
      id: llm
      position:
        x: 630
        y: 200
      positionAbsolute:
        x: 630
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm.text#}}'
        desc: ''
        selected: false
        title: Answer
        type: answer
        variables: []
      height: 90
      id: answer
      position:
        x: 930
        y: 200
      positionAbsolute:
        x: 930
        y: 200
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
