app:
  description: agent 章のサンプル。support-triage の IT 分岐を Agent ノード(FunctionCalling 戦略、Current
    Time ツール)に置き換えた Workflow
  icon: 🛠️
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: 'agent: support-triage-agent-node'
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.2@ef203a332d1b2b8952dbaa012be70be3e0a2d576b001489fb3b070efc970ffbe
    version: null
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: question-classifier
      id: start-source-classifier-target
      source: start
      sourceHandle: source
      target: classifier
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: llm
      id: classifier-1-llm_expense-target
      source: classifier
      sourceHandle: '1'
      target: llm_expense
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: llm
      id: classifier-2-llm_attendance-target
      source: classifier
      sourceHandle: '2'
      target: llm_attendance
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: question-classifier
        targetType: llm
      id: classifier-4-llm_other-target
      source: classifier
      sourceHandle: '4'
