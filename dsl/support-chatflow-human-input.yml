            temperature: 0.1
          mode: chat
          name: qwen2.5:7b
          provider: langgenius/ollama/ollama
        prompt_template:
        - role: system
          text: あなたは社内ヘルプデスクの担当者です。問い合わせへの回答案を日本語で 3 文以内で書きます。問い合わせの種別は「{{#conversation.category#}}」です。規程や手続きの詳細を断定できない場合、または種別が「その他」の場合は
            needs_human を true にしてください。出力は指定された JSON Schema に従ってください。
        - role: user
          text: '{{#sys.query#}}'
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              answer:
                description: 問い合わせへの回答案。日本語で 3 文以内
                type: string
              needs_human:
                description: 担当者による確認が必要なら true
                type: boolean
            required:
            - answer
            - needs_human
            type: object
        structured_output_enabled: true
        title: 'LLM: draft'
        type: llm
        vision:
          enabled: false
      height: 90
      id: llm_draft
      position:
        x: 1060
        y: 300
      positionAbsolute:
        x: 1060
        y: 300
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "\ndef main(result: dict) -> dict:\n    needs_human = result.get(\"\
          needs_human\", True)\n    if isinstance(needs_human, str):\n        needs_human\
          \ = needs_human.strip().lower() in (\"true\", \"yes\", \"1\")\n    return\
          \ {\"answer\": str(result.get(\"answer\", \"\")).strip(), \"needs_human\"\
          : bool(needs_human)}\n"
        code_language: python3
        desc: ''
        outputs:
          answer:
            children: null
            type: string
          needs_human:
            children: null
            type: boolean
        selected: false
        title: 'Code: normalize'
        type: code
        variables:
        - value_selector:
